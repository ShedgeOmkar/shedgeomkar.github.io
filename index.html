<style>
:root{
  --bg:#EDF0EC; --surface:#FFFFFF; --sunk:#E3E8E3; --ink:#18242A; --muted:#56656C; --line:#D2D9D4;
  --accent:#1F4E8C; --accent-ink:#FFFFFF; --p:#0E7A6B; --c:#A87308; --f:#B0426A; --k:#18242A;
  --good:#1D7A3D; --warn:#9A4D00; --bad:#B3261E;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11191D; --surface:#19232A; --sunk:#202D34; --ink:#E5ECE8; --muted:#9AA9A5; --line:#2C3B42;
    --accent:#86B4F2; --accent-ink:#0D1A2A; --p:#43C3AB; --c:#E2B34A; --f:#EB86AA; --k:#E5ECE8;
    --good:#6CCF8A; --warn:#F2A75D; --bad:#FF8B82;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11191D; --surface:#19232A; --sunk:#202D34; --ink:#E5ECE8; --muted:#9AA9A5; --line:#2C3B42;
  --accent:#86B4F2; --accent-ink:#0D1A2A; --p:#43C3AB; --c:#E2B34A; --f:#EB86AA; --k:#E5ECE8;
  --good:#6CCF8A; --warn:#F2A75D; --bad:#FF8B82;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.num,h1,h2,.big{font-family:"Barlow Condensed","Arial Narrow","Roboto Condensed",Barlow,sans-serif}
main{max-width:620px;margin:0 auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:28px;font-weight:700;margin:6px 0 2px;letter-spacing:.2px}
h2{font-size:21px;font-weight:600;margin:0 0 10px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:44px}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
label.f{display:block;font-size:14px;color:var(--muted);margin:8px 0 4px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}

/* date bar */
.datebar{display:flex;align-items:center;gap:6px;margin:4px 0 8px}
.datebar .d{flex:1;text-align:center}
.datebar .d .big{font-size:26px;font-weight:700;line-height:1.1}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 4px;min-height:36px}

/* the meter */
.meter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 6px}
.mrow{padding:6px 0 10px}
.mrow+.mrow{border-top:1px solid var(--line)}
.mhead{display:flex;align-items:baseline;gap:8px}
.mname{font-weight:600;width:72px;flex:none}
.mval{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:30px;font-weight:700;line-height:1}
.mval small{font-size:18px;font-weight:500;color:var(--muted)}
.mstat{margin-left:auto;font-size:14px;color:var(--muted);text-align:right}
.mstat.good{color:var(--good)} .mstat.warn{color:var(--warn)}
.track{position:relative;height:12px;background:var(--sunk);border-radius:6px;margin-top:8px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:6px}
.over{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 4px,rgba(0,0,0,.28) 4px 7px)}
.notarget{font-size:14px;color:var(--muted);margin:6px 0 4px}

/* items */
.foodtext{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px;white-space:pre-wrap}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-child{border-top:0}
.ihead{display:flex;gap:8px;align-items:flex-start}
.iname{font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.tag.lib{background:color-mix(in srgb,var(--p) 16%,transparent);color:var(--p)}
.tag.est{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.tag.imp{background:var(--sunk);color:var(--muted)}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.chk{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.isrc{font-size:13px;color:var(--muted);margin-top:2px}
.inums{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px;font-size:15px}
.inums input{width:84px;min-height:38px;padding:6px 8px}
.inums .mac input{width:66px}
.mac{display:inline-flex;align-items:center;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.xbtn{margin-left:auto;background:none;border:0;color:var(--muted);font-size:14px;padding:6px;min-height:36px}
.totline{display:flex;gap:14px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:10px;margin-top:6px;font-weight:600}
.notice{background:var(--sunk);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}
.notice.err{background:color-mix(in srgb,var(--bad) 13%,var(--surface));color:var(--ink)}
.addpanel{background:var(--bg);border-radius:12px;padding:10px;margin-top:10px}
.res{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.res input{width:80px;min-height:38px;padding:6px 8px}

/* segmented */
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:40px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.lasttime{background:var(--bg);border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 8px 8px 0;font-size:14px;margin-top:8px}

/* save bar */
.savebar{position:sticky;bottom:calc(60px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:10px 0;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.savebar .btn{flex:1}
.savebar[hidden]{display:none}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{display:flex;max-width:620px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 12px;min-height:58px;color:var(--muted);font-weight:600;font-size:15px;border-top:3px solid transparent}
nav.tabs button[aria-current=page]{color:var(--accent);border-top-color:var(--accent)}

/* history */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px}
.stat .big{font-size:26px;font-weight:700;line-height:1.1}
.chartwrap{overflow-x:auto}
.chart{width:100%;height:auto;display:block}
.dayrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;min-height:52px}
.dayrow .dd{width:116px;flex:none}
.dayrow .dd b{display:block}
.dayrow .nums{flex:1;font-size:15px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:6px 0}

/* foods */
.frow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;min-height:52px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 8px}
.formula{font-size:14px;background:var(--bg);border-radius:10px;padding:10px 12px;line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.mbox{background:var(--surface);color:var(--ink);border-radius:14px;padding:16px;max-width:420px;width:100%}
.btn.dangerfill{background:var(--bad);color:#fff}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .fill{transition:width .35s ease} }
</style>
</head>

const baseKcal = b => (b.kcal != null && b.kcal !== '') ? Number(b.kcal) : 4 * b.p + 4 * b.c + 9 * b.f;
function itemMac(it) {
  const k = it.base.per ? it.qty / it.base.per : 0;
  return {p: it.base.p * k, c: it.base.c * k, f: it.base.f * k, kcal: baseKcal(it.base) * k};
}
function sumItems(items) {
  const t = {p:0, c:0, f:0, kcal:0};
  for (const it of items) { const m = itemMac(it); t.p += m.p; t.c += m.c; t.f += m.f; t.kcal += m.kcal; }
  return t;

  if (!day) return null;
  if (day.items && day.items.length) { const t = sumItems(day.items); return {kcal:t.kcal, p:t.p, c:t.c, f:t.f}; }
  return day.tot || null;

  const w = (p.weights || []).slice().sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);

/* ---------------- food parser ---------------- */
/* ---- rule-based food parser (no AI) ---- */
const NUMW = {a:1, an:1, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10, eleven:11, twelve:12, half:0.5, quarter:0.25};
const UNIT_RE = /^(gms?|grams?|grm|g|ml|ltr|litres?|liters?|l|kg|scoops?|pieces?|pcs|pc|cups?|glass(?:es)?|plates?|spoons?|tsp|tbsp|bowls?|slices?)\b\.?\s*/;
const UNIT_NORM = u => /^(gms?|grams?|grm|g)$/.test(u) ? 'g' : /^ml$/.test(u) ? 'ml' : /^(ltr|litres?|liters?|l)$/.test(u) ? 'l' : u === 'kg' ? 'kg'
  : /^scoop/.test(u) ? 'scoop' : /^(pieces?|pcs|pc)$/.test(u) ? 'piece' : /^cup/.test(u) ? 'cup' : /^glass/.test(u) ? 'glass'
  : /^plate/.test(u) ? 'plate' : /^(spoons?|tbsp)$/.test(u) ? 'spoon' : u === 'tsp' ? 'tsp' : /^bowl/.test(u) ? 'bowl' : /^slice/.test(u) ? 'slice' : u;
const STOP = new Set(['of','size','sized','the','a','an','fresh','piece','pieces','pcs','pc','in','it','fruit','fruits']);
function normName(s) {
  return String(s).toLowerCase().replace(/\([^)]*\)/g, ' ').replace(/[^a-z0-9 ]+/g, ' ').split(/\s+/)
    .filter(w => w && !STOP.has(w))
    .map(w => (w.length <= 3 || /ss$/.test(w)) ? w : /ies$/.test(w) ? w.slice(0, -3) + 'y' : /(oes|ches|shes|xes)$/.test(w) ? w.slice(0, -2) : /s$/.test(w) ? w.slice(0, -1) : w)
    .join(' ');
}
function readQty(s) {
  let m, q = null, note = '';
  const N = '(\\d+(?:\\.\\d+)?|' + Object.keys(NUMW).join('|') + ')';
  const val = t => /^\d/.test(t) ? parseFloat(t) : NUMW[t];
  if ((m = s.match(new RegExp('^' + N + '\\s+and\\s+(?:a\\s+)?half\\b\\s*')))) { q = val(m[1]) + 0.5; }
  else if ((m = s.match(/^(\d+(?:\.\d+)?)\s*(?:-|to)\s*(\d+(?:\.\d+)?)\s*/))) { q = (parseFloat(m[1]) + parseFloat(m[2])) / 2; note = 'range, used the middle'; }
  else if ((m = s.match(/^(\d+)\s*\/\s*(\d+)\s+/))) { q = parseInt(m[1]) / parseInt(m[2]); }
  else if ((m = s.match(new RegExp('^' + N + '\\b\\s*')))) { q = val(m[1]); }
  if (m) s = s.slice(m[0].length);
  return {q, s, note};
}
function parsePart(raw) {
  let s = raw.toLowerCase().replace(/\s+/g, ' ').trim().replace(/^[,.\s]+|[,.\s]+$/g, '');
  let extra = '';
  const wi = s.search(/\b(which|that|having)\b/);
  if (wi > 0) { extra = s.slice(wi).trim(); s = s.slice(0, wi).trim(); }
  let {q, s:rest, note} = readQty(s);
  let unit = null, m;
  if ((m = rest.match(UNIT_RE))) { unit = UNIT_NORM(m[1]); rest = rest.slice(m[0].length); }
  rest = rest.replace(/^\/\s*\d+(?:\.\d+)?\s*[a-z]+\s*/, '').replace(/^of\s+/, '');
  // "x pieces" written after the name: "4 meduvada pieces"
  if (!unit && /\bpieces?\b/.test(rest)) unit = 'piece';
  let size = null;
  if ((m = rest.match(/\bvery big\b|\bvery large\b/))) size = 'xbig';
  else if ((m = rest.match(/\b(small|medium|big|large)\b/))) size = m[1] === 'large' ? 'big' : m[1];
  const name = rest.replace(/\b(very big|very large|small|medium|big|large)\b/g, ' ').replace(/\s+/g, ' ').trim();

}
function splitLog(text) {
  const out = [];
  for (let part of String(text).split(/[,\n;]+/)) {
    part = part.trim(); if (!part) continue;
    // "omlette of 2 eggs" stays together
    const pieces = /\b(which|that)\b/.test(part) ? [part] : part.split(/\s+with\s+|\s+and\s+(?=\d)|\s*\+\s*(?=\d)/);

}
function findFood(foods, name) {
  const n = normName(name);
  if (!n) return null;
  for (const f of foods) {
    const keys = [f.name].concat(f.aliases || []);
    if (keys.some(k => normName(k) === n)) return f;
  }
  return null;
}
/* returns {foodId|null, qty, unit, note, needs} in the food's own unit */
function toFoodQty(f, p) {
  let q = p.q, notes = [];
  if (p.note) notes.push(p.note);
  if (q == null) { q = 1; notes.push('no amount given, used 1'); }
  const u = p.unit;
  const sizeG = sz => f.pieceG ? (sz === 'xbig' ? Math.round(f.pieceG.big * 1.25) : f.pieceG[sz || 'medium']) : null;
  if (f.unit === 'g' || f.unit === 'ml') {
    if (u === f.unit) return {qty:q, notes};
    if ((u === 'g' && f.unit === 'ml') || (u === 'ml' && f.unit === 'g')) { notes.push('1 ' + u + ' counted as 1 ' + f.unit); return {qty:q, notes}; }
    if (u === 'kg' || u === 'l') return {qty:q * 1000, notes};
    if (!u || u === 'piece') {
      const g = sizeG(p.size);
      if (g) { notes.push(fmtQ(q) + ' ' + (p.size === 'xbig' ? 'very big' : p.size || 'medium') + ' = ' + Math.round(q * g) + ' ' + f.unit); return {qty:q * g, notes}; }
      if (p.q != null && p.q >= 10) { notes.push('no unit given, taken as ' + f.unit); return {qty:q, notes}; }
      return {qty:q, notes, needs:'Amount unclear: enter it in ' + f.unit};
    }
    const per = {glass:250, cup:150, bowl:150, spoon:15, tsp:5, plate:250, slice:30}[u];
    if (per) { notes.push('1 ' + u + ' taken as ' + per + ' ' + f.unit + '; adjust if needed'); return {qty:q * per, notes}; }

const fmtQ = n => String(Math.round(n * 100) / 100);
function parseLog(text, foods) {

      const r = toFoodQty(f, p);

    } else {
      const unit = p.unit || 'piece';
      const q = p.q == null ? 1 : p.q;

function libItem(f, qty, text, note, needs) {
  return {kind:'lib', foodId:f.id, name:f.name, qty:Math.round(qty * 10) / 10, unit:f.unit, base:{per:f.per, p:f.p, c:f.c, f:f.f, kcal:f.kcal ?? null}, text, note:note || '', check:needs || ''};

const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;


function runParse(text, replace) {
  let combined = null;
  if (!replace && S.draft.food && !S.draft.items.length) { combined = S.draft.food.replace(/[\s,]+$/, '') + ', ' + text.trim(); text = combined; replace = true; }
  const items = parseLog(text, S.foods);

function meterRow(name, color, val, target, unit, kind) {

    else if (kind === 'kcal') { if (Math.abs(diff) <= target * 0.05) { stat = 'On target'; cls = 'good'; } else if (diff > 0) stat = fmt(diff) + ' left'; else { stat = fmt(-diff) + ' over'; cls = 'warn'; } }
    else { if (diff >= 0) stat = fmt(diff) + ' ' + unit + ' left'; else { stat = fmt(-diff) + ' ' + unit + ' over'; cls = 'warn'; } }
  }
  const pct = target ? Math.min(100, val / target * 100) : 0;
  const overPct = target && val > target ? Math.min(100, (val - target) / val * 100) : 0;

function addResults() {

/* history */
function windowStats(n) {
  const T = computeTargets(S.profile);
  const start = addDays(todayStr(), -(n - 1));
  let k = 0, sum = {kcal:0, p:0, c:0, f:0}, hit = 0;
  for (const [d, v] of allDays()) {
    if (d < start || d > todayStr()) continue;
    const t = dayTotals(v); if (!t) continue;
    k++; sum.kcal += t.kcal; sum.p += t.p; sum.c += t.c; sum.f += t.f;
    if (T.p && t.p >= T.p) hit++;
  }
  return {k, avg: k ? {kcal:sum.kcal / k, p:sum.p / k, c:sum.c / k, f:sum.f / k} : null, hit, T};
}
function streak() {
  let d = todayStr(), n = 0;
  if (!dayTotals(getDay(d))) d = addDays(d, -1);
  while (dayTotals(getDay(d))) { n++; d = addDays(d, -1); }
  return n;
}
function barChart(key, color, target, label, unit) {
  const days = []; for (let i = 29; i >= 0; i--) days.push(addDays(todayStr(), -i));
  const vals = days.map(d => { const t = dayTotals(getDay(d)); return t ? t[key] : null; });
  const max = Math.max(target || 0, ...vals.filter(v => v != null), 1) * 1.1;
  const W = 600, H = 170, L = 34, B = 22, bw = (W - L) / 30;
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + ' over the last 30 days">';
  for (const g of [0.5, 1]) { const y = (H - B) - (H - B - 8) * g; s += '<text x="0" y="' + (y + 4) + '" font-size="11" fill="var(--muted)">' + fmt(max / 1.1 * g * 1.1) + '</text><line x1="' + L + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)"/>'; }
  vals.forEach((v, i) => {
    const x = L + i * bw + 2;
    if (v == null) { s += '<rect x="' + x + '" y="' + (H - B - 2) + '" width="' + (bw - 4) + '" height="2" fill="var(--line)"/>'; return; }
    const h = (H - B - 8) * v / max;
    s += '<rect x="' + x + '" y="' + (H - B - h) + '" width="' + (bw - 4) + '" height="' + h + '" rx="2" fill="' + color + '"><title>' + esc(niceDate(days[i])) + ': ' + fmt(v) + ' ' + unit + '</title></rect>';
  });
  if (target) { const y = (H - B) - (H - B - 8) * target / max; s += '<line x1="' + L + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--ink)" stroke-dasharray="5 4" stroke-width="1.5"/>'; }
  [0, 10, 20, 29].forEach(i => { s += '<text x="' + (L + i * bw + bw / 2) + '" y="' + (H - 6) + '" font-size="11" text-anchor="middle" fill="var(--muted)">' + esc(parseYmd(days[i]).getDate() + '/' + (parseYmd(days[i]).getMonth() + 1)) + '</text>'; });
  return s + '</svg>';
}
function viewHistory() {
  const w7 = windowStats(7), w30 = windowStats(30), T = w7.T;
  const st = a => a.avg ? '<div class="big">' + fmt(a.avg.kcal) + ' kcal</div><div class="small">P ' + fmt(a.avg.p) + ' · C ' + fmt(a.avg.c) + ' · F ' + fmt(a.avg.f) + ' g</div><div class="small muted">' + a.k + ' day' + (a.k === 1 ? '' : 's') + ' with macros' + (T.p ? ', protein hit on ' + a.hit : '') + '</div>' : '<div class="small muted">No days with macros</div>';
  let h = '<h1>History</h1><section class="card"><div class="stats"><div class="stat"><div class="small muted">Last 7 days, average</div>' + st(w7) + '</div><div class="stat"><div class="small muted">Last 30 days, average</div>' + st(w30) + '</div></div>' +
    '<p class="small" style="margin:10px 0 0">Logging streak: <b>' + streak() + ' day' + (streak() === 1 ? '' : 's') + '</b> in a row with macros.</p></section>';
  h += '<section class="card"><h2>Calories, last 30 days</h2><div class="legend"><span>Bars: eaten</span><span>Dashed line: target</span><span>Grey dash: no macros</span></div>' + barChart('kcal', 'var(--accent)', T.kcal, 'Calories', 'kcal') +
    '<h2 style="margin-top:16px">Protein, last 30 days</h2>' + barChart('p', 'var(--p)', T.p, 'Protein', 'g') + '</section>';
  const all = allDays().filter(([d]) => d <= todayStr());
  const missing = all.filter(([, v]) => v.food && !dayTotals(v)).length;
  const list = S.histFilter === 'missing' ? all.filter(([, v]) => v.food && !dayTotals(v)) : all;
  h += '<section class="card"><h2>Days</h2><div class="seg" role="group" style="margin-bottom:8px"><button data-act="hf" data-v="all" aria-pressed="' + (S.histFilter === 'all') + '">All (' + all.length + ')</button><button data-act="hf" data-v="missing" aria-pressed="' + (S.histFilter === 'missing') + '">No macros (' + missing + ')</button></div>';
  if (S.histFilter === 'missing' && missing) h += '<p class="small muted">Open a day and press “Calculate this day’s food”.</p>';
  if (!list.length) h += '<p class="muted">Nothing here yet.</p>';
  for (const [d, v] of list.slice(0, S.histN)) {
    const t = dayTotals(v);
    const pHit = t && T.p && t.p >= T.p;
    h += '<button class="dayrow" data-act="openday" data-d="' + d + '"><span class="dd"><b>' + esc(niceDate(d)) + '</b><span class="small muted">' + esc(d.slice(0, 4)) + '</span></span><span class="nums">' +
      (t ? '<b>' + fmt(t.kcal) + ' kcal</b> <span style="color:var(--p)">P ' + fmt(t.p) + (pHit ? ' ✓' : '') + '</span> <span class="muted">C ' + fmt(t.c) + ' F ' + fmt(t.f) + '</span>' + (v.items && v.items.length ? '' : ' <span class="tag imp">From Excel</span>')
         : (v.food ? '<span class="tag chk">No macros</span>' : '<span class="muted">No food logged</span>')) +
      (v.split ? '<div class="small muted">' + esc(v.split) + '</div>' : '') + '</span></button>';
  }
  if (list.length > S.histN) h += '<button class="btn quiet" style="width:100%;margin-top:8px" data-act="more">Show more days</button>';
  return h + '</section>';
}

/* workouts */
function viewWorkouts() {
  const days = allDays().filter(([d, v]) => d <= todayStr() && (v.workout || v.split));
  const since = addDays(todayStr(), -29);
  const counts = {};
  for (const [d, v] of days) if (d >= since && v.split) { const k = v.split.trim(); counts[k] = (counts[k] || 0) + 1; }
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  let h = '<h1>Workouts</h1><section class="card"><label class="f" for="wq" style="margin-top:0">Find an exercise</label><input type="search" id="wq" data-in="wq" value="' + esc(S.wq) + '" placeholder="squats, bench press, lat pulldown…"><div id="wres">' + workoutResults(days) + '</div></section>';
  h += '<section class="card"><h2>Last 30 days</h2>' + (top.length ? top.map(([k, n]) => '<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding:8px 0"><span>' + esc(k) + '</span><b>' + n + '</b></div>').join('') : '<p class="muted">No workouts logged in the last 30 days.</p>') + '</section>';
  return h;
}
function workoutResults(days) {
  days = days || allDays().filter(([d, v]) => d <= todayStr() && (v.workout || v.split));
  const q = S.wq.trim().toLowerCase();
  if (!q) {
    const recent = days.filter(([, v]) => (v.workout || '').trim()).slice(0, 12);
    if (!recent.length) return '<p class="muted" style="margin-top:10px">No workouts logged yet.</p>';
    return '<p class="small muted" style="margin:10px 0 2px">Recent sessions</p>' + recent.map(([d, v]) => '<div style="border-top:1px solid var(--line);padding:9px 0"><b>' + esc(niceDate(d)) + '</b> <span class="muted">' + esc(v.split || '') + '</span><div class="small">' + esc(v.workout) + '</div></div>').join('');
  }
  const out = [];
  for (const [d, v] of days) {
    const parts = String(v.workout || '').split(/,\s*(?![^()]*\))/);
    for (const p of parts) if (p.toLowerCase().includes(q)) out.push([d, v.split, p.trim()]);
    if (out.length >= 60) break;
  }
  if (!out.length) return '<p class="muted" style="margin-top:10px">No sessions mention “' + esc(S.wq) + '”.</p>';
  return '<p class="small muted" style="margin:10px 0 2px">' + out.length + (out.length >= 60 ? '+' : '') + ' entries, newest first</p>' + out.map(([d, s, p]) => '<div style="border-top:1px solid var(--line);padding:9px 0"><b>' + esc(niceDate(d)) + '</b> <span class="small muted">' + esc(s || '') + ', ' + esc(d.slice(0, 4)) + '</span><div>' + esc(p) + '</div></div>').join('');
}

function rateHtml(ws) {
  if (ws.length < 2) return '<p class="small muted">Lean bulk aim: about +0.5 to +1% of body weight a month. Log your weight once or twice a week to track it.</p>';
  const newest = ws[0];
  const old = ws.find(e => (parseYmd(newest.d) - parseYmd(e.d)) / 864e5 >= 14);
  if (!old) return '<p class="small muted">Keep logging; the monthly trend appears after 2 weeks of entries.</p>';
  const days = (parseYmd(newest.d) - parseYmd(old.d)) / 864e5;
  const perMonth = (newest.kg - old.kg) / days * 30;
  const lo = newest.kg * 0.005, hi = newest.kg * 0.01;
  let adv = perMonth > hi ? 'Faster than a lean bulk. Consider about 100–150 kcal less a day.' : perMonth < lo ? 'Slower than a lean bulk. If this holds for 3–4 weeks, add about 100–150 kcal a day.' : 'On track for a lean bulk.';
  return '<p class="small">Trend: <b>' + (perMonth >= 0 ? '+' : '') + fmt1(perMonth) + ' kg a month</b> since ' + esc(niceDate(old.d)) + '. Aim: +' + fmt1(lo) + ' to +' + fmt1(hi) + ' kg. ' + adv + '</p>';
}

/* ---------------- export ---------------- */
function csvCell(v) { const s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function buildCsv() {
  const wmap = {}; for (const e of S.profile.weights || []) wmap[e.d] = e.kg;
  const rows = [['Date','Day','Imp','Counting','Food Intake','Description','Calories','Protein','Carbs','Fats','Split','Workout','Weight','C']];
  const days = allDays().slice().reverse();
  for (const [d, v] of days) {
    const t = dayTotals(v);
    const desc = (v.items || []).map(it => { const m = itemMac(it); return it.name + ' ' + it.qty + ' ' + unitText(it.unit, it.qty) + ': P ' + fmt1(m.p) + ', C ' + fmt1(m.c) + ', F ' + fmt1(m.f) + ', ' + fmt(m.kcal) + ' kcal'; }).join(' | ');
    rows.push([d, DOW[parseYmd(d).getDay()], v.imp === 2 ? 'Y2' : v.imp === 1 ? 'Y' : '', v.count ?? '', v.food || '', desc,
      t ? Math.round(t.kcal) : '', t ? r1(t.p) : '', t ? r1(t.c) : '', t ? r1(t.f) : '', v.split || '', v.workout || '', wmap[d] ?? '', v.c === 2 ? 'Yes 2' : v.c === 1 ? 'Yes' : '']);
  }
  return '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}

/* ---------------- events ---------------- */
function ask(msg, opt) {
  opt = opt || {};
  return new Promise(res => {
    const w = document.createElement('div'); w.className = 'modal';
    w.innerHTML = '<div class="mbox" role="dialog" aria-modal="true"><p>' + esc(msg) + '</p>' + (opt.input != null ? '<input type="text" id="mdl-in" value="' + esc(opt.input) + '">' : '') +
      '<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn quiet" data-m="0">' + esc(opt.cancel || 'Cancel') + '</button><button class="btn ' + (opt.danger ? 'dangerfill' : '') + '" data-m="1">' + esc(opt.ok || 'OK') + '</button></div></div>';
    document.body.appendChild(w);
    const inp = w.querySelector('#mdl-in');
    (inp || w.querySelector('[data-m="1"]')).focus();
    w.addEventListener('click', e => {
      const m = e.target.closest('[data-m]'); e.stopPropagation(); if (!m) return;
      const v = m.dataset.m === '1' ? (inp ? (inp.value.trim() || false) : true) : false;
      w.remove(); res(v);
    });
  });
}
async function confirmLeave() { return !S.dirty || await ask('You have unsaved changes for ' + longDate(S.date) + '. Discard them?', {ok:'Discard', cancel:'Keep editing', danger:true}); }
async function goDate(d) { if (d === S.date) return; if (!(await confirmLeave())) { render(); return; } S.date = d; openDraft(d); render(); }

document.addEventListener('click', async ev => {
  const tb = ev.target.closest('[data-tab]');
  if (tb) { const ae0 = document.activeElement; if (ae0 && ae0.closest && ae0.closest('#view') && /^(INPUT|TEXTAREA|SELECT)$/.test(ae0.tagName)) ae0.blur(); }
  if (tb) {
    if (S.tab === 'log' && tb.dataset.tab !== 'log' && S.dirty) { if (!(await confirmLeave())) return; openDraft(S.date); }
    S.tab = tb.dataset.tab; S.msg = null; S.foodEdit = null;
    if (S.tab === 'log' && !S.draft) openDraft(S.date);
    render(); window.scrollTo(0, 0); return;
  }
  const b = ev.target.closest('[data-act]');
  if (!b || b.tagName === 'INPUT') return;
  const ae = document.activeElement;
  if (ae && ae !== b && ae.closest && ae.closest('#view') && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) ae.blur();
  const act = b.dataset.act, d = S.draft;
  switch (act) {
    case 'prev': goDate(addDays(S.date, -1)); break;
    case 'next': goDate(addDays(S.date, 1)); break;
    case 'today': goDate(todayStr()); break;
    case 'calc': {
      const t = S.meal.trim();
      if (!t) { S.msg = {err:true, t:'Type what you ate first.'}; render(); break; }
      runParse(t, false); break;
    }
    case 'calcday': runParse(d.food, true); break;
    case 'toggleadd': S.addOpen = !S.addOpen; render(); if (S.addOpen) { const i = document.querySelector('[data-in=addq]'); if (i) i.focus(); } break;
    case 'addfood': {
      const f = S.foods.find(x => x.id === b.dataset.id); const inp = document.getElementById('aq-' + b.dataset.id);
      const q = num(inp && inp.value);
      if (!f || q == null || q <= 0) { S.msg = {err:true, t:'Enter an amount above zero.'}; render(); break; }
      d.items.push({kind:'lib', foodId:f.id, name:f.name, qty:r1(q), unit:f.unit, base:{per:f.per, p:f.p, c:f.c, f:f.f, kcal:f.kcal ?? null}, text:'', note:''});
      S.msg = null; S.dirty = true; render(); break;
    }
    case 'addcustom':
      d.items.push({kind:'est', foodId:null, name:'Custom food', qty:1, unit:'piece', base:{per:1, p:0, c:0, f:0, kcal:null}, text:'', note:'Enter the name in “What you ate” and the macros here.', bad:true});
      S.dirty = true; S.addOpen = false; render(); break;
    case 'rm': d.items.splice(Number(b.dataset.i), 1); S.dirty = true; render(); break;
    case 'savefood': {
      const it = d.items[Number(b.dataset.i)]; if (!it) break;
      if (it.bad) break;
      const name = await ask('Save to your foods, with these macros for ' + it.qty + ' ' + unitText(it.unit, it.qty) + '. Name it the way you write it in your log:', {input:it.name, ok:'Save food'}); if (!name) break;
      const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30) + '-' + Math.random().toString(36).slice(2, 6);
      const unit = UNITS.includes(it.unit) ? it.unit : 'piece';
      const al = [name.trim().toLowerCase()]; if (it.key && !al.includes(it.key)) al.push(it.key);
      const nf = {id, name:name.trim(), aliases:al, unit, per:it.qty, p:r1(it.base.p * it.qty / it.base.per), c:r1(it.base.c * it.qty / it.base.per), f:r1(it.base.f * it.qty / it.base.per), kcal:null, src:'estimate', verify:false, note:'Saved from an estimate on ' + S.date + '.'};
      S.foods.push(nf);
      Object.assign(it, {kind:'lib', foodId:id, name:nf.name, unit, base:{per:nf.per, p:nf.p, c:nf.c, f:nf.f, kcal:null}, bad:false, note:''});
      // fill any other unmatched mentions of the same food in this day
      d.items.forEach(o => { if (o !== it && o.kind === 'est' && o.bad && o.key && al.includes(o.key) && o.unit === unit) Object.assign(o, {kind:'lib', foodId:id, name:nf.name, base:{per:nf.per, p:nf.p, c:nf.c, f:nf.f, kcal:null}, bad:false, note:''}); });
      S.dirty = true;
      try { await writeDoc('foods', {items:S.foods}); S.msg = {err:false, t:nf.name + ' saved to your foods.'}; } catch (e) { S.msg = {err:true, t:storeErr(e)}; }
      render();
      break;
    }
    case 'seg': d[b.dataset.k] = Number(b.dataset.v); S.dirty = true; render(); break;
    case 'save': {
      if (d.items.some(i => i.bad)) { S.msg = {err:true, t:'Some items have no macros. Fill them in or remove them, then save.'}; render(); break; }
      const day = {food:(d.food || '').trim(), items:d.items, split:(d.split || '').trim(), workout:(d.workout || '').trim(), count:d.count ?? null, imp:d.imp || 0, c:d.c || 0, updated:Date.now()};
      if (d.items.length) { const t = sumItems(d.items); day.tot = {kcal:Math.round(t.kcal), p:r1(t.p), c:r1(t.c), f:r1(t.f)}; day.src = 'app'; }
      else if (d.tot) { day.tot = d.tot; day.src = d.src || 'imported'; }
      else day.src = 'app';
      const mid = monthId(S.date);
      const days = Object.assign({}, clone(S.months[mid] || {}));
      days[S.date] = day;
      S.saving = true; render();
      try { await writeDoc(mid, {month:S.date.slice(0, 7), days}); S.months[mid] = days; S.dirty = false; openDraft(S.date); S.msg = {err:false, t:'Saved ' + longDate(S.date) + '.'}; }
      catch (e) { S.msg = {err:true, t:storeErr(e)}; }
      S.saving = false; render(); break;
    }
    case 'discard': openDraft(S.date); render(); break;
    case 'delday': {
      if (!(await ask('Delete everything logged on ' + longDate(S.date) + '?', {ok:'Delete day', danger:true}))) break;
      const mid = monthId(S.date); const days = clone(S.months[mid] || {}); delete days[S.date];
      try { await writeDoc(mid, {month:S.date.slice(0, 7), days}); S.months[mid] = days; openDraft(S.date); S.msg = {err:false, t:'Deleted.'}; }
      catch (e) { S.msg = {err:true, t:storeErr(e)}; }
      render(); break;
    }
    case 'hf': S.histFilter = b.dataset.v; S.histN = 60; render(); break;
    case 'more': S.histN += 60; render(); break;
    case 'openday': S.date = b.dataset.d; openDraft(S.date); S.tab = 'log'; render(); window.scrollTo(0, 0); break;
    case 'newfood': S.foodEdit = {id:'f-' + Math.random().toString(36).slice(2, 9), name:'', aliases:[], unit:'g', per:100, p:'', c:'', f:'', kcal:null, src:'label', verify:false, note:''}; S.msg = null; render(); break;
    case 'editfood': S.foodEdit = clone(S.foods.find(x => x.id === b.dataset.id)); S.msg = null; render(); window.scrollTo(0, 0); break;
    case 'cancelfood': S.foodEdit = null; S.msg = null; render(); break;
    case 'savefoodform': {
      const f = S.foodEdit;
      const per = num(f.per), p = num(f.p), c = num(f.c), fa = num(f.f), k = num(f.kcal);
      if (!String(f.name || '').trim()) { S.msg = {err:true, t:'Give the food a name.'}; render(); break; }
      if (per == null || per <= 0 || p == null || c == null || fa == null || p < 0 || c < 0 || fa < 0) { S.msg = {err:true, t:'Enter the amount and protein, carbs and fat as numbers (0 is fine).'}; render(); break; }
      const pg = f.pieceG && (f.unit === 'g' || f.unit === 'ml') ? f.pieceG : null;
      const pieceOk = pg && num(pg.small) && num(pg.medium) && num(pg.big);
      if (pg && (num(pg.small) || num(pg.medium) || num(pg.big)) && !pieceOk) { S.msg = {err:true, t:'Fill all three piece weights, or leave all three blank.'}; render(); break; }
      const clean = {id:f.id, name:f.name.trim(), aliases:(Array.isArray(f.aliases) ? f.aliases : String(f.aliases || '').split(',')).map(a => a.trim().toLowerCase()).filter(Boolean),
        unit:f.unit, per, p, c, f:fa, kcal:k, src:f.src || 'label', verify:!!f.verify, note:f.note || ''};
      if (pieceOk) clean.pieceG = {small:num(pg.small), medium:num(pg.medium), big:num(pg.big)};
      if (clean.unit !== 'g' && clean.unit !== 'ml' && num(f.g) > 0) clean.g = num(f.g);
      const next = S.foods.slice(); const i = next.findIndex(x => x.id === clean.id);
      if (i >= 0) next[i] = clean; else next.push(clean);
      try { await writeDoc('foods', {items:next}); S.foods = next; S.foodsFromDb = true; S.foodEdit = null; S.msg = null; }
      catch (e) { S.msg = {err:true, t:storeErr(e)}; }
      render(); break;
    }
    case 'delfood': {
      if (!(await ask('Delete ' + S.foodEdit.name + ' from your foods? Saved days are not affected.', {ok:'Delete food', danger:true}))) break;
      const next = S.foods.filter(x => x.id !== S.foodEdit.id);
      try { await writeDoc('foods', {items:next}); S.foods = next; S.foodEdit = null; }
      catch (e) { S.msg = {err:true, t:storeErr(e)}; }
      render(); break;
    }
    case 'addweight': {
      const dd = document.getElementById('wd').value, kg = num(document.getElementById('wkg').value);
      if (!dd || kg == null || kg < 20 || kg > 300) { S.msg = {err:true, t:'Enter a date and a weight in kg.'}; render(); break; }
      const p = clone(S.profile); p.weights = (p.weights || []).filter(e => e.d !== dd); p.weights.push({d:dd, kg:r1(kg)});
      await saveProfile(p); break;
    }
    case 'delweight': {
      const p = clone(S.profile); p.weights = (p.weights || []).filter(e => e.d !== b.dataset.d); await saveProfile(p); break;
    }
    case 'export': {
      download('macro-log-' + todayStr() + '.csv', buildCsv(), 'text/csv'); S.msg = {err:false, t:'CSV downloaded.'}; render(); break;
    }
    case 'backup': {
      S.lastBackup = Date.now();
      const data = {app:'macro-log', version:1, exported:new Date().toISOString(), months:S.months, profile:S.profile, foods:S.foods};
      download('macro-log-backup-' + todayStr() + '.json', JSON.stringify(data), 'application/json');
      try { persist(); } catch (e) {}
      S.msg = {err:false, t:'Backup downloaded. Keep the file somewhere safe.'}; render(); break;
    }
    case 'restore': {
      const inp = document.getElementById('restorefile'); if (inp) { inp.value = ''; inp.click(); } break;
    }
  }
});
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
}
async function restoreFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { S.msg = {err:true, t:'That file isn’t a Macro Log backup.'}; render(); return; }
  if (!data || data.app !== 'macro-log' || typeof data.months !== 'object') { S.msg = {err:true, t:'That file isn’t a Macro Log backup.'}; render(); return; }
  const n = Object.values(data.months).reduce((a, m) => a + Object.keys(m || {}).length, 0);
  const have = Object.values(S.months).reduce((a, m) => a + Object.keys(m || {}).length, 0);
  const ok = await ask('This backup has ' + n + ' days. ' + (have ? 'It replaces the ' + have + ' days on this phone.' : '') + ' Restore it?', {ok:'Restore', danger:have > 0});
  if (!ok) return;
  const prev = {months:S.months, profile:S.profile, foods:S.foods};
  S.months = clone(data.months);
  if (data.profile) S.profile = Object.assign(clone(DEFAULT_PROFILE), data.profile);
  if (Array.isArray(data.foods)) { S.foods = clone(data.foods); S.foodsFromDb = true; }
  try { persist(); S.msg = {err:false, t:'Restored ' + n + ' days.'}; openDraft(S.date, true); }
  catch (e) { S.months = prev.months; S.profile = prev.profile; S.foods = prev.foods; S.msg = {err:true, t:storeErr(e)}; }
  render();
}
async function saveProfile(p) {
  try { await writeDoc('profile', p); S.profile = p; S.msg = null; }
  catch (e) { S.msg = {err:true, t:storeErr(e)}; }
  render();
}
document.addEventListener('input', ev => {
  const t = ev.target, d = S.draft;
  const k = t.dataset.in;
  if (k === 'meal') S.meal = t.value;
  else if (k === 'split') { d.split = t.value; markDirty(); const lt = document.getElementById('lasttime'); if (lt) lt.innerHTML = lastTimeHtml(); }
  else if (k === 'workout') { d.workout = t.value; markDirty(); }
  else if (k === 'count') { d.count = num(t.value); markDirty(); }
  else if (k === 'addq') { S.addQ = t.value; const r = document.getElementById('addres'); if (r) r.innerHTML = addResults(); }
  else if (k === 'wq') { S.wq = t.value; const r = document.getElementById('wres'); if (r) r.innerHTML = workoutResults(); }
  else if (k === 'foodq') { S.foodQ = t.value; }
  else if (t.dataset.ff && S.foodEdit) {
    const f = S.foodEdit, key = t.dataset.ff;
    if (key === 'verify') f.verify = t.checked;
    else if (key.startsWith('pg-')) { f.pieceG = f.pieceG || {}; f.pieceG[key.slice(3)] = t.value; }
    else if (key === 'aliases') f.aliases = t.value;
    else if (key === 'g') f.g = t.value;
    else f[key] = t.value;
  }
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'restorefile') { if (t.files && t.files[0]) restoreFile(t.files[0]); return; }
  if (t.dataset.act === 'pickdate') { if (t.value) { t.blur(); goDate(t.value); } return; }
  if (t.dataset.ch === 'qty') {
    const it = S.draft.items[Number(t.dataset.i)], q = num(t.value);
    if (it && q != null && q > 0) {
      if (it.kind === 'est') it.base = {per:q, p:r1(it.base.p * q / it.base.per), c:r1(it.base.c * q / it.base.per), f:r1(it.base.f * q / it.base.per), kcal:null};
      it.qty = r1(q); S.dirty = true;
    }
    t.blur(); render(); return;
  }
  if (t.dataset.ch === 'mac') {
    const it = S.draft.items[Number(t.dataset.i)], v = num(t.value);
    if (it && v != null && v >= 0) {
      const m = itemMac(it); m[t.dataset.k] = v;
      it.base = {per:it.qty, p:r1(m.p), c:r1(m.c), f:r1(m.f), kcal:null};
      if (it.bad && (it.base.p + it.base.c + it.base.f) > 0) it.bad = false;
      S.dirty = true;
    }
    t.blur(); render(); return;
  }
  if (t.dataset.ff === 'unit' && S.foodEdit) { S.foodEdit.unit = t.value; render(); return; }
  if (t.dataset.pf) {
    const p = clone(S.profile), key = t.dataset.pf;
    if (key === 'sex') p.sex = t.value;
    else { const v = num(t.value); if (t.value !== '' && v == null) return; p[key] = v; }
    t.blur(); await saveProfile(p); return;
  }
  if (t.dataset.ov) {
    const p = clone(S.profile); p.override = Object.assign({}, p.override || {});
    p.override[t.dataset.ov] = t.value === '' ? null : num(t.value);
    t.blur(); await saveProfile(p); return;
  }
  if (t.dataset.in === 'foodq') { t.blur(); render(); }
});
document.addEventListener('focusout', () => { setTimeout(() => { if (S.pendingRender) render(); }, 0); });
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ---------------- start ---------------- */
function init() {
  let raw = null;
  try { localStorage.setItem('macrolog.test', '1'); localStorage.removeItem('macrolog.test'); raw = localStorage.getItem(STORE_KEY); }
  catch (e) { S.noStore = true; render(); return; }
  if (raw) {
    try {
      const d = JSON.parse(raw);
      S.months = d.months || {};
      S.profile = Object.assign(clone(DEFAULT_PROFILE), d.profile || {});
      S.profile.override = Object.assign({kcal:null, p:null, c:null, f:null}, (d.profile && d.profile.override) || {});
      if (Array.isArray(d.foods) && d.foodsFromDb) { S.foods = d.foods; S.foodsFromDb = true; }
      S.lastBackup = d.lastBackup || null;
    } catch (e) { S.msg = {err:true, t:'Saved data couldn’t be read. Restore your last backup under Me.'}; }
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  S.loaded = true;
  openDraft(S.date, true);
  render();
}
init();
</script>
